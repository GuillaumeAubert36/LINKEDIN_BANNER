<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LinkedIn Banner Pro</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;700;800&display=swap');

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        /* Main container - LinkedIn format */
        .banner {
            width: 1584px;
            height: 396px;
            background: linear-gradient(120deg, #0b1120 0%, #1e1b4b 60%, #2e1065 100%);
            position: relative;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
        }

        /* --- GEOMETRIC DECORATIONS --- */
        .glow-circle {
            position: absolute;
            top: -150px;
            right: -100px;
            width: 600px;
            height: 600px;
            background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, transparent 70%);
            border-radius: 50%;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .geo-lines {
            position: absolute;
            left: 0;
            top: 0;
            width: 500px;
            height: 100%;
            opacity: 0.2;
            background-image: 
                linear-gradient(45deg, transparent 48%, rgba(255,255,255,0.1) 49%, rgba(255,255,255,0.1) 51%, transparent 52%),
                linear-gradient(-45deg, transparent 48%, rgba(255,255,255,0.1) 49%, rgba(255,255,255,0.1) 51%, transparent 52%);
            background-size: 60px 60px;
            mask-image: linear-gradient(to right, black, transparent);
            -webkit-mask-image: linear-gradient(to right, black, transparent);
        }

        .dots-pattern {
            position: absolute;
            bottom: 40px;
            right: 60px;
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            opacity: 0.15;
        }
        
        .dot {
            width: 4px;
            height: 4px;
            background-color: #fff;
            border-radius: 50%;
        }

        /* --- MAIN CONTENT --- */
        .content {
            position: relative;
            z-index: 10;
            text-align: center;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            transform: translateX(-60px);
        }

        /* Name */
        .name {
            font-size: 48px;
            font-weight: 800;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            background: linear-gradient(to right, #ffffff, #a5b4fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 5px;
        }

        /* New Senior Full Stack title */
        .title-pill {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(165, 180, 252, 0.3);
            padding: 8px 24px;
            border-radius: 50px;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            color: #e0e7ff;
            backdrop-filter: blur(10px);
            display: flex;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            margin-bottom: 10px;
        }

        .title-pill span.code-icon {
            color: #818cf8;
            font-family: monospace;
            font-size: 18px;
            font-weight: bold;
        }

        /* Headline / Value proposition */
        .headline {
            font-size: 26px;
            font-weight: 400;
            color: #f1f5f9;
            letter-spacing: 0.5px;
            max-width: 950px;
            line-height: 1.4;
            margin-bottom: 15px;
        }

        .headline strong {
            font-weight: 700;
            color: #a78bfa; /* Bright light purple */
        }

        /* Badges (Experience & CTA) */
        .badges-container {
            display: flex;
            gap: 15px;
            margin-top: 5px;
        }

        .badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 10px 24px;
            border-radius: 50px;
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.5px;
            color: #cbd5e1;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .badge.highlight {
            background: linear-gradient(90deg, #6366f1 0%, #8b5cf6 100%);
            border: none;
            color: white;
            box-shadow: 0 4px 15px rgba(99, 102, 241, 0.4);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .badge.highlight:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(99, 102, 241, 0.6);
        }

        /* Email */
        .email {
            font-size: 15px;
            color: #e0e7ff;
            text-decoration: none;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: color 0.3s;
            margin-top: 10px;
        }

        .email:hover {
            color: #fff;
        }
        
        .email::before {
            content: "✉ ";
            font-size: 14px;
            color: #818cf8;
        }

    </style>
</head>
<body>

    <div class="banner">
        <!-- Decorations -->
        <div class="glow-circle"></div>
        <div class="geo-lines"></div>
        <div class="dots-pattern">
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
            <div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div><div class="dot"></div>
        </div>

        <!-- Content -->
        <div class="content">
            <div class="name">Guillaume Aubert</div>
            
            <!-- The new title badge -->
            <div class="title-pill">
                <span class="code-icon">&lt;/&gt;</span> Senior Full-Stack Software Engineer | .NET / React
            </div>

            <div class="headline">
                Turning your business challenges into <strong>custom, high-performing</strong> solutions
            </div>

            <div class="badges-container">
                <div class="badge">
                    <span>★</span> 6+ Years of Experience
                </div>
                <div class="badge highlight">
                    Let's talk about your project <span>→</span>
                </div>
            </div>

            <a href="mailto:aubert.guillaume36@gmail.com" class="email">
                aubert.guillaume36@gmail.com
            </a>
        </div>
    </div>

</body>
</html>
